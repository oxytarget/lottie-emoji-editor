# Publishes the editor to GitHub Pages: https://<owner>.github.io/<repo>/
# (HTTPS hosting that also works as a Telegram Mini App URL).
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bot_api_url:
        description: Bot backend URL (empty = .env.production, repository variable BOT_API_URL or the Cloudflare worker)
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one, a running deploy is not cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Fails with a clear message if Pages is not enabled for the repository yet.
      - uses: actions/configure-pages@v5
      # "Send to chat" needs the bot backend URL (worker/); without it the Mini App falls back to downloads.
      - name: Resolve bot backend URL
        env:
          INPUT_URL: ${{ inputs.bot_api_url }}
          VAR_URL: ${{ vars.BOT_API_URL }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          url="${INPUT_URL:-$VAR_URL}"
          if [ -z "$url" ] && [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            sub=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain" | jq -r '.result.subdomain // empty' || true)
            if [ -n "$sub" ]; then url="https://emoji-studio-bot.$sub.workers.dev"; fi
          fi
          if [ -n "$url" ]; then
            echo "Bot backend: $url"
            echo "VITE_BOT_API_URL=$url" >> "$GITHUB_ENV"
          else
            # Keep .env.production (if any) in charge — an empty variable would override it.
            echo "Bot backend: from .env.production or none"
          fi
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
