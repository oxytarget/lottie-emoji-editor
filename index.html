<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0e15" />
    <meta name="description" content="Редактор анімованих Lottie/TGS емодзі для Telegram: текст, SVG-логотипи, кольори, експорт." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='.15' y1='0' x2='.85' y2='1'%3E%3Cstop offset='0' stop-color='%23c4b5fd'/%3E%3Cstop offset='.5' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%236d28d9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='40' height='40' rx='10' fill='%23f1ecff'/%3E%3Cpath d='M18 6c1.2 7.6 4.8 11.2 12.4 12.4C22.8 19.6 19.2 23.2 18 30.8c-1.2-7.6-4.8-11.2-12.4-12.4C13.2 17.2 16.8 13.6 18 6Z' fill='url(%23g)'/%3E%3Cpath d='M30.5 5c.4 2.6 1.6 3.8 4.2 4.2-2.6.4-3.8 1.6-4.2 4.2-.4-2.6-1.6-3.8-4.2-4.2 2.6-.4 3.8-1.6 4.2-4.2Z' fill='%236d28d9'/%3E%3C/svg%3E" />
    <title>Emoji Studio — Lottie emoji editor</title>
    <script>
      // The theme before the first paint (no flash): the saved choice, else Telegram's or the system's scheme.
      // The same logic lives in src/lib/theme.ts.
      (function () {
        var theme;
        try {
          theme = JSON.parse(localStorage.getItem('emoji-studio') || '{}').state.theme;
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = 'dark';
          try {
            var params = /tgWebAppThemeParams=([^&]+)/.exec(location.hash);
            var bg = params && JSON.parse(decodeURIComponent(params[1])).bg_color;
            if (bg && /^#[0-9a-f]{6}$/i.test(bg)) {
              var n = parseInt(bg.slice(1), 16);
              theme = ((n >> 16) * 299 + ((n >> 8) & 255) * 587 + (n & 255) * 114) / 1000 > 140 ? 'light' : 'dark';
            } else if (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) {
              theme = 'light';
            }
          } catch (e) {}
        }
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'light' ? '#f4f4f9' : '#0e0e15');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
