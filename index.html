<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0e15" />
    <meta name="description" content="Редактор анімованих Lottie/TGS емодзі для Telegram: текст, SVG-логотипи, кольори, експорт." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%238b5cf6'/%3E%3Ccircle cx='14.5' cy='16' r='2.6' fill='white'/%3E%3Ccircle cx='25.5' cy='16' r='2.6' fill='white'/%3E%3Cpath d='M12.5 23.5c4 5 11 5 15 0' fill='none' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>Emoji Studio — Lottie emoji editor</title>
    <script>
      // The theme before the first paint (no flash): the saved choice, else Telegram's or the system's scheme.
      // The same logic lives in src/lib/theme.ts.
      (function () {
        var theme;
        try {
          theme = JSON.parse(localStorage.getItem('emoji-studio') || '{}').state.theme;
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = 'dark';
          try {
            var params = /tgWebAppThemeParams=([^&]+)/.exec(location.hash);
            var bg = params && JSON.parse(decodeURIComponent(params[1])).bg_color;
            if (bg && /^#[0-9a-f]{6}$/i.test(bg)) {
              var n = parseInt(bg.slice(1), 16);
              theme = ((n >> 16) * 299 + ((n >> 8) & 255) * 587 + (n & 255) * 114) / 1000 > 140 ? 'light' : 'dark';
            } else if (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) {
              theme = 'light';
            }
          } catch (e) {}
        }
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'light' ? '#f4f4f9' : '#0e0e15');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
